# Example policy for aws-s3-reverse-proxy in multi-tenant mode.
#
# Mount this read-only (a ConfigMap, typically). It contains no secrets and
# nothing tenant-specific: onboarding a tenant never touches this file.
#
# The two secrets live in the environment or a mounted secret instead:
#   UPSTREAM_ACCESS_KEY_ID / UPSTREAM_SECRET_ACCESS_KEY  (or UPSTREAM_CREDENTIALS)
#   CREDENTIAL_PEPPER                                    (or CREDENTIAL_PEPPER_FILE)

identity:
  # The named capture groups `tenant` and `level` are the only contract
  # between the component that issues credentials to clients and this proxy.
  # The pattern must match the whole access-key id.
  accessKeyIdPattern: '^(?P<tenant>[0-9a-f]{32})(?P<level>ro|rw|rws)$'

  # The message the derived secret is an HMAC over:
  #   secret = hex(HMAC-SHA256(CREDENTIAL_PEPPER, secretTemplate))
  # Both the issuer and the proxy derive it independently, so there is no
  # credential store and no distribution problem — and rotating the pepper
  # rotates every client credential at once.
  #
  # It must reference BOTH {tenant} and {level}, and startup fails if it does
  # not: a secret bound to only one of them is a single secret shared by every
  # identity that differs in the other, and the tenant and level a request
  # acts as come from the access-key id rather than from the secret.
  #
  # Use an unambiguous delimiter between the two, as below. With a
  # variable-length tenant capture, '{tenant}{level}' would derive the same
  # secret for (tenant=ab, level=c) and (tenant=a, level=bc).
  secretTemplate: '{tenant}:{level}'

  # Prepended by the proxy to every object key and to every listing
  # prefix/marker. Clients never send it and never see it.
  #
  # It must reference {tenant} and end in '/', and startup fails if it does
  # not. The trailing separator is what makes two tenants' prefixes mutually
  # exclusive: with a bare '{tenant}' and a variable-length capture, tenant
  # "a" asking for the key "b/x.csv" would address tenant "ab"'s "x.csv".
  keyPrefixTemplate: '{tenant}/'

# The level names. Every rule's `grant` map must cover exactly these — a
# rule that omits one, or names an unknown one, fails validation at startup.
levels: [ro, rw, rws]

# Ordered, first-match-wins, with an implicit `deny` at the end: anything
# not matched by a rule is denied.
#
# Path patterns are globs over the client-facing key:
#   **  matches across `/`      *  stays inside one segment   ?  one character
#
# A permission expands to a set of HTTP methods:
#   read = GET / HEAD (a LIST is a GET)
#   full = read plus PUT / POST / DELETE, including every multipart step
rules:
  - pathPattern: 'datasets/**'
    grant: { ro: read, rw: full, rws: full }

  # A more specific carve-out has to be expressible *before* the broader
  # rule it sits inside. This is what makes "writable, except this
  # sub-path" possible at all.
  - pathPattern: 'workspaces/*/inbox/**'
    grant: { ro: read, rw: read, rws: read }

  - pathPattern: 'workspaces/**'
    grant: { ro: full, rw: full, rws: full }
