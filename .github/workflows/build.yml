name: CI
on:
  - push
  - pull_request

# A newer push supersedes a running pipeline on the same ref. Master is left
# alone so every commit there finishes and publishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./...

      - name: Build Docker image
        run: docker build -t aws-s3-reverse-proxy .

      - name: Run Docker image
        run: docker run --rm aws-s3-reverse-proxy --help

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Test
        run: go test -v ./...

  e2e:
    name: End-to-end
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      # Real S3 clients, a real proxy and a real MinIO, across three
      # deployment variants. See e2e/README.md.
      - name: Run the end-to-end suite
        run: ./e2e/run.sh

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --tail 200

  publish:
    name: Publish image
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
