name: CI
on:
  - push
  - pull_request

# A newer push supersedes a running pipeline on the same ref. Master is left
# alone so every commit there finishes and publishes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  # The image is built exactly once, here. E2E tests it and publish pushes
  # it, both from this artifact, so what ships is what was tested.
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t aws-s3-reverse-proxy:ci .

      - name: Run Docker image
        run: docker run --rm aws-s3-reverse-proxy:ci --help

      - name: Export image
        run: docker save aws-s3-reverse-proxy:ci | gzip > image.tar.gz

      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: image
          path: image.tar.gz
          retention-days: 1

  test:
    name: Test
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Build
        run: go build -v ./...

      - name: Test
        run: go test -v ./...

  e2e:
    name: End-to-end
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      # Real S3 clients, a real proxy and a real MinIO, across three
      # deployment variants. See e2e/README.md.
      - name: Run the end-to-end suite
        run: ./e2e/run.sh
        env:
          E2E_PROXY_IMAGE: aws-s3-reverse-proxy:ci

      - name: Dump stack logs on failure
        if: failure()
        run: docker compose -f e2e/docker-compose.yml logs --tail 200

  publish:
    name: Publish image
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download image
        uses: actions/download-artifact@v4
        with:
          name: image

      - name: Load image
        run: gunzip -c image.tar.gz | docker load

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push
        run: |
          repo="ghcr.io/${GITHUB_REPOSITORY,,}"
          for tag in latest "$GITHUB_SHA"; do
            docker tag aws-s3-reverse-proxy:ci "$repo:$tag"
            docker push "$repo:$tag"
          done
