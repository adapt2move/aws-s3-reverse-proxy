name: Release
on:
  push:
    branches: [master]

# Every commit on master finishes and publishes; none cancels another.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  publish:
    name: Build, push and sign image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades the workflow's OIDC token for a
      # short-lived Sigstore certificate, so there is no key to manage.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

      # Signed by digest, so the signature covers exactly the bytes pushed
      # above, whichever tag later points where.
      - name: Sign image
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
