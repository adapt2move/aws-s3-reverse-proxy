name: Release
on:
  push:
    branches: [master]

# No concurrency group: GitHub keeps only one pending run per group, so a
# burst of pushes would silently drop the commits in between. Every commit
# gets its own run and its own SHA tag; the latest step below keeps
# overlapping runs from moving `latest` backwards.

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  publish:
    name: Build, push and sign image
    needs: test
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign trades the workflow's OIDC token for a
      # short-lived Sigstore certificate, so there is no key to manage.
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}

      # Signed by digest, so the signature covers exactly the bytes pushed
      # above, whichever tag later points at them.
      - name: Sign image
        run: cosign sign --yes "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}

      # Runs can overlap, so `latest` only moves when this commit is still
      # the head of master. A run for an older commit that finishes last
      # leaves it alone.
      - name: Tag as latest
        run: |
          head=$(git ls-remote origin refs/heads/master | cut -f1)
          if [[ "$head" != "$GITHUB_SHA" ]]; then
            echo "master has moved on to $head, leaving latest alone"
            exit 0
          fi
          docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE@$DIGEST"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
